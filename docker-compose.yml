services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devserver
      POSTGRES_PASSWORD: devserver
      POSTGRES_DB: devserver
    ports:
      - "5433:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devserver -d devserver"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
